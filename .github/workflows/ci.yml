name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.observability.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/PaidTraffic.Api --no-build --configuration Release
      - name: Build and start complete demo
        run: |
          docker compose up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs --tail=80
          exit 1
      - name: Verify automatic and approval demos
        shell: pwsh
        run: ./scripts/demo.ps1
      - name: Verify exported business telemetry
        run: |
          for attempt in $(seq 1 30); do
            docker compose logs collector > /tmp/pta-telemetry.log
            if grep -q campaign_evaluations_total /tmp/pta-telemetry.log && grep -q campaign.pause /tmp/pta-telemetry.log; then exit 0; fi
            sleep 2
          done
          tail -80 /tmp/pta-telemetry.log
          exit 1
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop demo
        if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
