name: paid-traffic-automation
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - traffic-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["--migrate"]
    environment:
      ConnectionStrings__Traffic: Host=postgres;Database=traffic;Username=traffic;Password=local-demo-only
      Demo__Enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment:
      ConnectionStrings__Traffic: Host=postgres;Database=traffic;Username=traffic;Password=local-demo-only
      Demo__Enabled: "true"
      Evaluation__Enabled: "${EVALUATION_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  traffic-data:
